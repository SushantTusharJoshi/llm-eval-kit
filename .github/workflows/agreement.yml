# Judge agreement with human labels (EK-F12), run by hand.
# Scores the 20 hand-labelled cases in examples/judge_agreement/labels.csv with the live Groq judge
# and reports percent agreement and Cohen's kappa in the job summary and as an artifact.
name: Judge agreement

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: judge-agreement
  cancel-in-progress: false

jobs:
  agreement:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Score labelled cases with the Groq judge
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          if [ -z "$GROQ_API_KEY" ]; then
            echo "::notice::GROQ_API_KEY is not set; skipping."
            exit 0
          fi
          python -m llm_eval_kit.agreement examples/judge_agreement/labels.csv \
            --judge-provider groq --out agreement.json | tee agreement.txt
          {
            echo "## Judge agreement"
            echo
            echo '```'
            cat agreement.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: agreement
          path: |
            agreement.json
            agreement.txt
          if-no-files-found: ignore
