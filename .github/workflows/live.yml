# Real-provider smoke tests and the nightly provider drift check. Runs on push
# to main, nightly, and by hand, never on pull requests, so forks cannot reach
# the secret or the AWS role.
#
# Drift: the provider changes behaviour under the same model name. The groq job
# runs the pytest smoke test and examples/drift/groq_drift.yaml against its
# committed baseline; drift-report opens or updates one "drift" issue when
# either fails, and comments on that issue when a later run is clean.
name: Live smoke tests

on:
  push:
    branches: [main]
  schedule:
    - cron: "30 6 * * *" # 06:30 UTC nightly
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-smoke
  cancel-in-progress: false

jobs:
  groq:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HAS_GROQ_KEY: ${{ secrets.GROQ_API_KEY != '' }}
    outputs:
      smoke: ${{ steps.smoke.outcome }}
      drift: ${{ steps.drift.outcome }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Groq smoke test (skips itself if the secret is not set)
        id: smoke
        continue-on-error: true
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: pytest -m live -k groq -rs --tb=short
      - name: Groq drift suite vs committed baseline
        id: drift
        if: env.HAS_GROQ_KEY == 'true'
        continue-on-error: true
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          set -o pipefail
          llm-eval-kit examples/drift/groq_drift.yaml --provider groq \
            --baseline examples/baselines/groq_drift.json \
            --no-cache --max-calls 6 --max-cost 0.02 -v 2>&1 | tee drift-output.txt
      - name: Job summary
        if: always()
        env:
          SMOKE: ${{ steps.smoke.outcome }}
          DRIFT: ${{ steps.drift.outcome }}
        run: |
          {
            echo "## Groq live checks"
            echo ""
            echo "| Check | Outcome |"
            echo "|---|---|"
            echo "| pytest smoke test | ${SMOKE:-not run} |"
            echo "| drift suite vs baseline | ${DRIFT:-not run} |"
            if [ -f drift-output.txt ]; then
              echo ""
              echo '```text'
              cat drift-output.txt
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$HAS_GROQ_KEY" != "true" ]; then
            echo "::notice title=Groq drift check skipped::GROQ_API_KEY is not set"
          fi
      - name: Fail the job if a check failed
        if: steps.smoke.outcome == 'failure' || steps.drift.outcome == 'failure'
        run: |
          echo "::error title=Groq live check failed::smoke=${{ steps.smoke.outcome }} drift=${{ steps.drift.outcome }}"
          exit 1

  bedrock:
    # Skipped entirely unless the repo variable AWS_ROLE_ARN is set;
    # drift-report writes a notice when it is skipped.
    if: ${{ vars.AWS_ROLE_ARN != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # only this job assumes the AWS role
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: aws-actions/configure-aws-credentials@45666896f5d8e0f10ae255413f3a4cdd03bdc8f5 # v6.3.1
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
      - run: pip install -e ".[dev,bedrock]"
      - name: Bedrock smoke test
        env:
          BEDROCK_MODEL_ID: ${{ vars.BEDROCK_MODEL_ID }}
        run: pytest -m live -k bedrock -rs --tb=short

  drift-report:
    # Opens or updates one "Provider drift detected" issue when the Groq checks
    # fail; comments on it when a later run is clean. Never closes it.
    needs: [groq, bedrock]
    if: ${{ always() && needs.groq.result != 'cancelled' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write # only this job touches issues
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      GROQ_RESULT: ${{ needs.groq.result }}
      SMOKE: ${{ needs.groq.outputs.smoke }}
      DRIFT: ${{ needs.groq.outputs.drift }}
      BEDROCK_RESULT: ${{ needs.bedrock.result }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      EVENT: ${{ github.event_name }}
      TITLE: Provider drift detected
    steps:
      - name: Decide state
        id: state
        run: |
          if [ "$SMOKE" = "failure" ] || [ "$DRIFT" = "failure" ] || [ "$GROQ_RESULT" = "failure" ]; then
            state=drift
          elif [ "$GROQ_RESULT" = "success" ] && [ "$DRIFT" = "success" ]; then
            state=clean
          else
            state=skipped
          fi
          echo "state=$state" >> "$GITHUB_OUTPUT"
          if [ "$BEDROCK_RESULT" = "skipped" ]; then
            echo "::notice title=Bedrock skipped::AWS_ROLE_ARN is not set; the bedrock job did not run"
          fi
      - name: Open or update the drift issue
        if: steps.state.outputs.state == 'drift'
        run: |
          if ! gh label list --limit 200 --json name --jq '.[].name' | grep -qx drift; then
            gh label create drift --color B60205 --description "Provider behaviour changed under the same model name"
          fi
          number=$(gh issue list --label drift --state open --limit 50 --json number,title \
            --jq "map(select(.title == \"$TITLE\")) | .[0].number // empty")
          body="Groq live checks failed on a ${EVENT} run: smoke=${SMOKE:-not run}, drift suite=${DRIFT:-not run}.
          Run: ${RUN_URL}

          If the provider changed on purpose, review the run summary and refresh the baseline with
          \`llm-eval-kit examples/drift/groq_drift.yaml --provider groq --baseline examples/baselines/groq_drift.json --update-baseline\`."
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
            echo "issue=#$number (commented)" >> "$GITHUB_ENV"
          else
            url=$(gh issue create --title "$TITLE" --label drift --body "$body")
            echo "issue=$url (created)" >> "$GITHUB_ENV"
          fi
      - name: Comment that the latest run is clean
        if: steps.state.outputs.state == 'clean'
        run: |
          number=$(gh issue list --label drift --state open --limit 50 --json number,title \
            --jq "map(select(.title == \"$TITLE\")) | .[0].number // empty")
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "Latest run is clean (${EVENT}): ${RUN_URL}. Leaving this issue open for a person to close."
            echo "issue=#$number (clean comment)" >> "$GITHUB_ENV"
          else
            echo "issue=none open" >> "$GITHUB_ENV"
          fi
      - name: Job summary
        if: always()
        run: |
          {
            echo "## Provider drift report"
            echo ""
            echo "| Item | Value |"
            echo "|---|---|"
            echo "| Trigger | ${EVENT} |"
            echo "| State | ${{ steps.state.outputs.state }} |"
            echo "| Groq smoke | ${SMOKE:-not run} |"
            echo "| Groq drift suite | ${DRIFT:-not run} |"
            echo "| Bedrock job | ${BEDROCK_RESULT} |"
            echo "| Drift issue | ${issue:-no action} |"
          } >> "$GITHUB_STEP_SUMMARY"
