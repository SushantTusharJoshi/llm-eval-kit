[project]
name = "llm-eval-kit"
version = "0.1.0"
description = "Evaluate LLM outputs against golden examples with CI-friendly pass/fail gating"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Sushant Joshi", email = "joshi.sus@northeastern.edu"}]
keywords = ["llm", "evaluation", "testing", "ci", "rag", "golden-examples"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "pyyaml>=6.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.8.0",
]

[project.scripts]
llm-eval-kit = "llm_eval_kit.cli:main"

[project.urls]
Repository = "https://github.com/SushantTusharJoshi/llm-eval-kit"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_eval_kit"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["llm_eval_kit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
