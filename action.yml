name: llm-eval-kit regression gate
description: Run an llm-eval-kit suite in CI and fail the job on a critical failure or a quality drop beyond tolerance.
branding:
  icon: check-circle
  color: green

inputs:
  suite:
    description: Path to the suite YAML or JSON.
    required: true
  baseline:
    description: Path to the baseline JSON in the repo. Leave empty to skip the regression comparison.
    required: false
    default: ""
  provider:
    description: Model under test, one of mock, groq, openai, bedrock.
    required: false
    default: mock
  model:
    description: Model ID. Defaults come from GROQ_MODEL, BEDROCK_MODEL_ID or OPENAI_MODEL.
    required: false
    default: ""
  aws-role-arn:
    description: IAM role to assume with GitHub OIDC. The calling job needs permissions id-token write.
    required: false
    default: ""
  aws-region:
    description: AWS region for Bedrock and S3.
    required: false
    default: us-east-1
  max-cost:
    description: Stop the run when estimated live spend reaches this many USD.
    required: false
    default: ""
  report-path:
    description: Where to write the JSON report.
    required: false
    default: llm-eval-report.json
  extra-args:
    description: Extra CLI arguments, for example "--max-calls 50 --no-cache".
    required: false
    default: ""
  python-version:
    description: Python version to install.
    required: false
    default: "3.12"

outputs:
  report-path:
    description: Path of the JSON report.
    value: ${{ inputs.report-path }}

runs:
  using: composite
  steps:
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: ${{ inputs.python-version }}

    - name: Configure AWS credentials (OIDC)
      if: ${{ inputs.aws-role-arn != '' }}
      uses: aws-actions/configure-aws-credentials@45666896f5d8e0f10ae255413f3a4cdd03bdc8f5 # v6.3.1
      with:
        role-to-assume: ${{ inputs.aws-role-arn }}
        aws-region: ${{ inputs.aws-region }}

    - name: Install llm-eval-kit
      shell: bash
      env:
        KIT_PATH: ${{ github.action_path }}
      run: python -m pip install --disable-pip-version-check "${KIT_PATH}[bedrock]"

    - name: Run suite
      shell: bash
      # Inputs arrive as env vars, never interpolated into the script, so a crafted
      # input cannot inject shell commands.
      env:
        IN_SUITE: ${{ inputs.suite }}
        IN_BASELINE: ${{ inputs.baseline }}
        IN_PROVIDER: ${{ inputs.provider }}
        IN_MODEL: ${{ inputs.model }}
        IN_REGION: ${{ inputs.aws-region }}
        IN_MAX_COST: ${{ inputs.max-cost }}
        IN_REPORT: ${{ inputs.report-path }}
        IN_EXTRA: ${{ inputs.extra-args }}
      run: |
        args=("$IN_SUITE" --provider "$IN_PROVIDER" --region "$IN_REGION" --report "$IN_REPORT" -v)
        if [ -n "$IN_BASELINE" ]; then args+=(--baseline "$IN_BASELINE"); fi
        if [ -n "$IN_MODEL" ]; then args+=(--model "$IN_MODEL"); fi
        if [ -n "$IN_MAX_COST" ]; then args+=(--max-cost "$IN_MAX_COST"); fi
        read -r -a extra <<< "$IN_EXTRA"
        llm-eval-kit "${args[@]}" "${extra[@]}"
